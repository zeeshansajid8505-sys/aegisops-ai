services:
  postgres:
    image: postgres:16-alpine
    container_name: aegisops-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aegisops_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aegisops_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegisops-network

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegisops-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aegisops-network:
    driver: bridge
